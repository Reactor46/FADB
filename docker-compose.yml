version: '3.8'

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: reactor46/fadb-app:latest
    container_name: fadb-app
    restart: unless-stopped
    volumes:
      - ./data:/usr/src/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "8080:5000"

# Single-container setup: the server builds the React frontend and serves it from /public

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: reactor46/fadb-server:latest
    container_name: fadb-server
    restart: unless-stopped
    volumes:
      - ./data:/usr/src/app/data
    environment:
      - NODE_ENV=production
      - PORT=5000
    ports:
      - "5000:5000"

  web:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: reactor46/fadb-web:latest
    container_name: fadb-web
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8000:80"

# Optional: add a reverse proxy or TLS in front of web if exposing publicly

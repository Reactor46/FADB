version: '3.8'

services:
  backend:
    build: ./server
    container_name: fadb-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./data:/app/data:ro
    ports:
      - "8000:8000"
  frontend:
    build: ./web
    container_name: fadb-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

# Note: SQLite is file-based in ./data/fadb_sample.sqlite which is included in repo sample data.

services:
  backend:
    build: ./server
    container_name: fadb-backend
    restart: unless-stopped
    env_file:
      - ./server/.env
    volumes:
      - ./data:/app/data:ro
      - fadb-db:/app/db
    ports:
      - "8000:8000"
  frontend:
    build: ./web
    container_name: fadb-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  fadb-db:

# Notes:
# - ./data (containing sample_firearms.csv) is mounted read-only into the
#   backend at /app/data. It's the *source* data used to seed the DB.
# - The SQLite database itself lives in the named volume `fadb-db`,
#   mounted at /app/db (writable), so it persists across container
#   restarts without needing write access to the read-only source data.

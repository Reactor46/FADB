services:
  mariadb:
    image: mariadb:10.11
    container_name: fadb-mariadb
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MARIADB_DATABASE}
      - MYSQL_USER=${MARIADB_USER}
      - MYSQL_PASSWORD=${MARIADB_PASSWORD}
    volumes:
      - ./mariadb_data:/var/lib/mysql
    ports:
      - "3306:3306"

  traefik:
    image: traefik:v3.0
    container_name: traefik
    restart: unless-stopped
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: reactor46/fadb-app:latest
    container_name: fadb-app-mariadb
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_TYPE=mariadb
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${MARIADB_DATABASE}
      - DB_USER=${MARIADB_USER}
      - DB_PASS=${MARIADB_PASSWORD}
    volumes:
      - ./data:/usr/src/app/data
    ports:
      - "8081:5000"
    # Traefik labels - uncomment and adjust domain to enable traefik routing
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.fadb.rule=Host(`fadb.local`)"
    #   - "traefik.http.services.fadb.loadbalancer.server.port=5000"
    depends_on:
      - mariadb
      - traefik
